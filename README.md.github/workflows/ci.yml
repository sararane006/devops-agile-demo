# devops-agile-demo
name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build check
        run: echo "Build successful"

      - name: Unit test
        run: echo "Tests passed"

      - name: Code quality
        run: echo "Code quality check passed"
